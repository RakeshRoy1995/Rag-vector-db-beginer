<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Question Answering</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #677084;
    --border: #e2e5eb; --accent: #3b5bdb; --accent-soft: #e8edff;
    --ok: #2b8a3e; --err: #c92a2a; --code: #f1f3f5;
    --t-text: #495057; --t-table: #1971c2; --t-figure: #9c36b5;
    --t-equation: #e8590c; --t-heading: #2b8a3e; --t-caption: #868e96;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171c; --panel: #1c2027; --text: #e6e8ec; --muted: #9aa3b2;
      --border: #2c323c; --accent: #7b93ff; --accent-soft: #252d4a;
      --code: #232830; --t-text: #adb5bd;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--text); }
  .app { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
  aside { border-right: 1px solid var(--border); background: var(--panel);
          padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  h1 { font-size: 17px; margin: 0; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
  .muted { color: var(--muted); font-size: 13px; }

  .drop { border: 2px dashed var(--border); border-radius: 10px; padding: 22px 12px;
          text-align: center; cursor: pointer; transition: .15s; }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop input { display: none; }

  .job { border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 13px; }
  .bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .bar > div { height: 100%; background: var(--accent); transition: width .4s; }
  .job.error { border-color: var(--err); color: var(--err); }

  .doc { padding: 9px 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  .doc:hover { background: var(--bg); }
  .doc.active { border-color: var(--accent); background: var(--accent-soft); }
  .doc b { display: block; font-size: 14px; word-break: break-all; }

  .tabs { display: flex; gap: 4px; padding: 10px 16px 0; border-bottom: 1px solid var(--border); background: var(--panel); }
  .tab { padding: 8px 14px; border: 0; background: none; color: var(--muted); cursor: pointer;
         font: inherit; border-bottom: 2px solid transparent; }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .view { flex: 1; overflow-y: auto; padding: 20px; min-height: 0; }
  .hidden { display: none !important; }

  /* chat */
  .chat { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 820px; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; padding: 9px 14px; border-radius: 14px 14px 2px 14px; }
  .msg.bot { background: var(--panel); border: 1px solid var(--border); padding: 12px 16px; border-radius: 14px 14px 14px 2px; }
  .msg.bot p:first-child { margin-top: 0; } .msg.bot p:last-child { margin-bottom: 0; }
  .searched { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .cite { display: inline-block; min-width: 20px; padding: 0 5px; margin: 0 1px; border-radius: 5px;
          background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 600;
          text-align: center; cursor: pointer; border: 0; font-family: inherit; }
  .sources { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .source { border: 1px solid var(--border); border-radius: 8px; font-size: 13px; }
  .source summary { padding: 7px 10px; cursor: pointer; list-style: none; display: flex; gap: 8px; align-items: baseline; }
  .source summary::-webkit-details-marker { display: none; }
  .source .body { padding: 0 10px 10px; white-space: pre-wrap; color: var(--muted); }
  .source.flash { outline: 2px solid var(--accent); }
  .source img { max-width: 100%; max-height: 320px; display: block; margin-top: 8px; border-radius: 6px; background: #fff; }
  .composer { display: flex; gap: 8px; padding: 12px 20px 18px; border-top: 1px solid var(--border); background: var(--panel); }
  .composer textarea { flex: 1; resize: none; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
                       background: var(--bg); color: var(--text); font: inherit; min-height: 44px; max-height: 160px; }
  button.primary { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 0 18px;
                   font: inherit; font-weight: 600; cursor: pointer; }
  button.primary:disabled { opacity: .5; cursor: default; }
  button.ghost { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 10px;
                 padding: 0 12px; font: inherit; cursor: pointer; }
  select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 0 8px; font: inherit; }
  .typing::after { content: "Thinking…"; color: var(--muted); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .4; } }

  /* items + chunks */
  .page-h { font-size: 12px; color: var(--muted); margin: 22px 0 8px; text-transform: uppercase; letter-spacing: .06em; }
  .item { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--c, var(--border));
          border-radius: 6px; padding: 8px 12px; margin-bottom: 6px; }
  .item.heading, .item.title { font-weight: 700; font-size: 16px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase;
           color: var(--c); margin-right: 8px; letter-spacing: .04em; }
  .item img { max-width: 100%; max-height: 420px; display: block; margin-top: 8px; border-radius: 4px; background: #fff; }
  .md-table { overflow-x: auto; }
  .md-table table { border-collapse: collapse; font-size: 13px; margin-top: 6px; }
  .md-table td, .md-table th { border: 1px solid var(--border); padding: 3px 8px; }
  .eq { overflow-x: auto; padding: 4px 0; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .chip { border: 1px solid var(--border); background: var(--panel); color: var(--muted); border-radius: 20px;
          padding: 3px 10px; font-size: 13px; cursor: pointer; }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .chunk { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; }
  .chunk .meta { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .chunk pre { white-space: pre-wrap; margin: 0; font: 13px/1.5 ui-monospace, Consolas, monospace; }
  .empty { text-align: center; color: var(--muted); margin-top: 80px; }
  code { background: var(--code); padding: 1px 4px; border-radius: 4px; }

  .t-text, .t-paragraph { --c: var(--t-text); } .t-table { --c: var(--t-table); }
  .t-figure { --c: var(--t-figure); } .t-equation { --c: var(--t-equation); }
  .t-heading, .t-title { --c: var(--t-heading); } .t-caption { --c: var(--t-caption); }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; height: auto; min-height: 100vh; }
    aside { border-right: 0; border-bottom: 1px solid var(--border); }
    main { height: 100vh; }
    .view, .messages { padding: 14px 16px; }
    .composer { padding: 10px 16px 14px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div>
      <h1>PDF Question Answering</h1>
      <div class="muted">Upload a PDF, inspect the extraction, ask questions.</div>
    </div>

    <label class="drop" id="drop">
      <input type="file" id="file" accept="application/pdf,.pdf">
      <div><b>Drop a PDF here</b></div>
      <div class="muted">or click to choose · processing takes 1–3 min</div>
    </label>

    <div id="jobs"></div>

    <div>
      <h2>Documents</h2>
      <div id="docs"><div class="muted">No documents yet.</div></div>
    </div>
  </aside>

  <main>
    <nav class="tabs">
      <button class="tab active" data-tab="chat">Ask</button>
      <button class="tab" data-tab="items">Extracted</button>
      <button class="tab" data-tab="chunks">Chunks</button>
    </nav>

    <section class="chat" id="tab-chat">
      <div class="messages" id="messages">
        <div class="empty" id="chat-empty">Ask anything about your uploaded PDFs.<br>
          Answers cite their sources — click <span class="cite">1</span> to see the passage.</div>
      </div>
      <form class="composer" id="ask-form">
        <textarea id="question" rows="1" placeholder="e.g. How many attention heads are used?"></textarea>
        <select id="ctype" title="Search only this content type">
          <option value="">All</option><option value="text">Text</option>
          <option value="table">Tables</option><option value="figure">Figures</option>
        </select>
        <button type="button" class="ghost" id="reset" title="Forget conversation history">New chat</button>
        <button class="primary" id="send">Ask</button>
      </form>
    </section>

    <section class="view hidden" id="tab-items"><div class="empty">Select a document on the left.</div></section>
    <section class="view hidden" id="tab-chunks"><div class="empty">Select a document on the left.</div></section>
  </main>
</div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const md = s => window.marked && window.DOMPurify ? DOMPurify.sanitize(marked.parse(s || "")) : `<p>${esc(s)}</p>`;
const imgUrl = p => "/" + String(p).replace(/\\/g, "/").replace(/^\/+/, "");

let sessionId;
try { sessionId = localStorage.getItem("rag-session"); } catch {}
if (!sessionId) {
  sessionId = crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2);
  try { localStorage.setItem("rag-session", sessionId); } catch {}
}

let activeDoc = null;
let docCache = {};

async function api(path, opts = {}) {
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || res.statusText);
  return data;
}

/* ---------------- tabs ---------------- */
document.querySelectorAll(".tab").forEach(btn => btn.onclick = () => {
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b === btn));
  ["chat", "items", "chunks"].forEach(t => $(`#tab-${t}`).classList.toggle("hidden", t !== btn.dataset.tab));
});

/* ---------------- upload ---------------- */
const drop = $("#drop"), fileInput = $("#file");
["dragenter", "dragover"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", ev => ev.dataTransfer.files[0] && upload(ev.dataTransfer.files[0]));
fileInput.onchange = () => fileInput.files[0] && upload(fileInput.files[0]);

async function upload(file) {
  const form = new FormData();
  form.append("file", file);
  const box = document.createElement("div");
  box.className = "job";
  box.innerHTML = `<b>${esc(file.name)}</b><div class="stage">Uploading…</div><div class="bar"><div style="width:2%"></div></div>`;
  $("#jobs").prepend(box);
  try {
    const job = await api("/api/upload", { method: "POST", body: form });
    poll(job.job_id, box);
  } catch (e) {
    box.classList.add("error");
    $(".stage", box).textContent = e.message;
  }
  fileInput.value = "";
}

async function poll(jobId, box) {
  try {
    const job = await api(`/api/jobs/${jobId}`);
    $(".stage", box).textContent = job.status === "done"
      ? `Ready · ${job.items} items → ${job.chunks} chunks` : job.stage + "…";
    $(".bar > div", box).style.width = job.progress + "%";
    if (job.status === "running") return setTimeout(() => poll(jobId, box), 1500);
    if (job.status === "error") { box.classList.add("error"); $(".stage", box).textContent = job.error; return; }
    delete docCache[job.source];
    await loadDocs();
    selectDoc(job.source);
    setTimeout(() => box.remove(), 6000);
  } catch (e) {
    setTimeout(() => poll(jobId, box), 3000);
  }
}

/* ---------------- documents ---------------- */
async function loadDocs() {
  const { documents } = await api("/api/documents");
  const el = $("#docs");
  if (!documents.length) { el.innerHTML = `<div class="muted">No documents yet.</div>`; return; }
  el.innerHTML = documents.map(d => {
    const t = d.types || {};
    return `<div class="doc ${d.source === activeDoc ? "active" : ""}" data-src="${esc(d.source)}">
      <b>${esc(d.source)}</b>
      <span class="muted">${d.pages} pages · ${d.chunks} chunks · ${t.table || 0} tables · ${t.figure || 0} figures · ${t.equation || 0} equations</span>
    </div>`;
  }).join("");
  el.querySelectorAll(".doc").forEach(n => n.onclick = () => selectDoc(n.dataset.src));
}

async function selectDoc(source) {
  activeDoc = source;
  document.querySelectorAll(".doc").forEach(n => n.classList.toggle("active", n.dataset.src === source));
  if (!docCache[source]) {
    $("#tab-items").innerHTML = $("#tab-chunks").innerHTML = `<div class="empty">Loading…</div>`;
    docCache[source] = await api(`/api/documents/${encodeURIComponent(source)}`);
  }
  renderItems(docCache[source].items);
  renderChunks(docCache[source].chunks);
}

function renderEquation(latex) {
  if (!window.katex) return `<code>${esc(latex)}</code>`;
  try { return katex.renderToString(latex, { displayMode: true, throwOnError: true }); }
  catch { return `<code>${esc(latex)}</code>`; }
}

function renderItems(items) {
  let page = null, html = "";
  for (const it of items) {
    if (it.page !== page) { page = it.page; html += `<div class="page-h">Page ${esc(page)}</div>`; }
    const type = it.type;
    let body = "";
    if (type === "table") {
      body = `${it.title ? `<div>${esc(it.title)}</div>` : ""}<div class="md-table">${md(it.table_data)}</div>`;
    } else if (type === "figure") {
      body = esc(it.title || "(no caption)");
    } else if (type === "equation") {
      body = `<div class="eq">${renderEquation(it.text_fallback)}</div>`;
    } else {
      body = esc(it.content);
    }
    const img = it.image_path ? `<img loading="lazy" src="${esc(imgUrl(it.image_path))}" alt="">` : "";
    html += `<div class="item ${esc(type)} t-${esc(type)}"><span class="badge">${esc(type)}</span>${body}${img}</div>`;
  }
  $("#tab-items").innerHTML = html || `<div class="empty">No items.</div>`;
}

function renderChunks(chunks) {
  const types = [...new Set(chunks.map(c => c.type))];
  const view = $("#tab-chunks");
  const draw = active => {
    const shown = chunks.filter(c => !active || c.type === active);
    view.innerHTML = `
      <div class="filters">
        <button class="chip ${!active ? "on" : ""}" data-t="">All (${chunks.length})</button>
        ${types.map(t => `<button class="chip ${active === t ? "on" : ""}" data-t="${esc(t)}">${esc(t)} (${chunks.filter(c => c.type === t).length})</button>`).join("")}
      </div>
      <div class="muted" style="margin-bottom:12px">The embedded text is <code>embedding_text</code>: a Document / Section header plus the content below.</div>
      ${shown.map(c => `
        <div class="chunk t-${esc(c.type)}">
          <div class="meta"><span class="badge">${esc(c.type)}</span>
            p.${esc(c.page_start)}${c.page_end !== c.page_start ? "–" + esc(c.page_end) : ""} ·
            ${esc(c.section_path || "front matter")} · ${c.char_count} chars · <code>${esc(c.chunk_id)}</code></div>
          <pre>${esc(c.content)}</pre>
        </div>`).join("")}`;
    view.querySelectorAll(".chip").forEach(b => b.onclick = () => draw(b.dataset.t));
  };
  draw("");
}

/* ---------------- chat ---------------- */
const q = $("#question"), send = $("#send"), messages = $("#messages");
q.addEventListener("input", () => { q.style.height = "auto"; q.style.height = q.scrollHeight + "px"; });
q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#ask-form").requestSubmit(); } });

function addMsg(cls, html) {
  $("#chat-empty")?.remove();
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.innerHTML = html;
  messages.appendChild(el);
  messages.scrollTop = messages.scrollHeight;
  return el;
}

function renderAnswer(res) {
  // [1] / [2][3] -> clickable chips (text only, not inside code)
  let html = md(res.answer).replace(/\[(\d{1,2})\]/g, (m, n) =>
    res.sources.some(s => s.n == n) ? `<button class="cite" data-n="${n}">${n}</button>` : m);
  const searched = res.search_query !== res.question
    ? `<div class="searched">Searched: ${esc(res.search_query)}</div>` : "";
  const sources = res.sources.map(s => `
    <details class="source t-${esc(s.type)}" data-n="${s.n}">
      <summary><span class="cite">${s.n}</span><span class="badge">${esc(s.type)}</span>
        <span class="muted">${esc(s.citation)}</span></summary>
      <div class="body">${esc(s.content)}${(s.image_paths || []).map(p => `<img loading="lazy" src="${esc(imgUrl(p))}" alt="">`).join("")}</div>
    </details>`).join("");
  return `${searched}${html}<div class="sources">${sources}</div>`;
}

messages.addEventListener("click", e => {
  const btn = e.target.closest("button.cite");
  if (!btn) return;
  const src = btn.closest(".msg").querySelector(`.source[data-n="${btn.dataset.n}"]`);
  if (!src) return;
  src.open = true;
  src.scrollIntoView({ behavior: "smooth", block: "nearest" });
  src.classList.add("flash");
  setTimeout(() => src.classList.remove("flash"), 1200);
});

$("#ask-form").onsubmit = async e => {
  e.preventDefault();
  const question = q.value.trim();
  if (!question) return;
  q.value = ""; q.style.height = "auto";
  addMsg("user", esc(question));
  const bot = addMsg("bot typing", "");
  send.disabled = true;
  try {
    const res = await api("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, session_id: sessionId, chunk_type: $("#ctype").value || null }),
    });
    bot.classList.remove("typing");
    bot.innerHTML = renderAnswer(res);
  } catch (err) {
    bot.classList.remove("typing");
    bot.innerHTML = `<span style="color:var(--err)">${esc(err.message)}</span>`;
  }
  send.disabled = false;
  messages.scrollTop = messages.scrollHeight;
  q.focus();
};

$("#reset").onclick = async () => {
  await api("/api/reset", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session_id: sessionId }) }).catch(() => {});
  messages.innerHTML = `<div class="empty" id="chat-empty">New conversation. Ask anything about your PDFs.</div>`;
};

/* ---------------- start ---------------- */
loadDocs().then(() => {
  const first = $(".doc");
  if (first) selectDoc(first.dataset.src);
}).catch(() => {});
</script>
</body>
</html>
